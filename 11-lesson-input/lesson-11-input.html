<!DOCTYPE html>

<head>
    <title> Lesson 11 </title>
    <meta charset="utf-8" />
    <script>
        function welcomeUser() {
            // get the name from the input field
            var sum = +document.getElementById("fname").value + +document.getElementById("lname").value
            // set the name on the h1 tag
            document.getElementById("sum").innerHTML = sum;
        }
    </script>
</head>

<body>
    <!-- Input tags are parts are used to get data from the user -->
    <label for="fname">Első szám:</label>
    <input id="fname"></input> <br><br>
    <label for="lname">Második szám:</label>
    <input id="lname"></input> <br><br>
    <button onclick="welcomeUser()">Welcome</button>

    <h1 id="sum">Eredmény itt lesz</h1>
</body>

</html>
